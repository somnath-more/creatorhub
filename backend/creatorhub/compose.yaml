services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: creatorhub
      POSTGRES_USER: creatorhub
      # Local development default; override for any shared environment.
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-creatorhub}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5433}:5432"
    volumes:
      - creatorhub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creatorhub -d creatorhub"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  creatorhub-postgres:
