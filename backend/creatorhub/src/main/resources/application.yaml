spring:
  config:
    import:
      - optional:file:./.env.local.properties
      - optional:file:./backend/creatorhub/.env.local.properties
  application:
    name: creatorhub
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/creatorhub}
    username: ${DATABASE_USERNAME:creatorhub}
    password: ${DATABASE_PASSWORD:creatorhub}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
