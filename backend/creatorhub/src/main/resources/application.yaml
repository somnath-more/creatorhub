spring:
  mail:
    host: ${SMTP_HOST:127.0.0.1}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000
  config:
    import:
      - optional:file:./.env.local.properties
      - optional:file:./backend/creatorhub/.env.local.properties
  application:
    name: creatorhub
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/creatorhub}
    username: ${DATABASE_USERNAME:creatorhub}
    password: ${DATABASE_PASSWORD:creatorhub}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
app:
  verification:
    demo-approval-enabled: ${DEMO_VERIFICATION_ENABLED:false}
  recovery:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    from: ${MAIL_FROM:no-reply@creatorhub.local}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
